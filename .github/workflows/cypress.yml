name: Testes End-to-End Trabalho conclusao do curso automacao web PGATS 2026

#  Define quando o teste vai rodar automaticamente
on:
  push:
    branches: ["main", "master"] # Roda sempre que houver um push na branch principal
  pull_request:
    branches: ["main", "master"] # Roda sempre que abrirem um Pull Request para a branch principal
  workflow_dispatch: 

  # Configurando para rodar os testes a cada 1 hora
  schedule:
    - cron: '24 */4 * * *'

jobs:
  cypress-run:
    runs-on: ubuntu-latest # Sistema operacional da máquina virtual do GitHub

    steps:
      # Passo 1: Copia o código do seu repositório para dentro da máquina virtual
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # Passo 2: Instala dependências e roda os testes usando a Action oficial do Cypress
      - name: Executar Testes do Cypress
        uses: cypress-io/github-action@v6
        with:
          command: npx cypress run --spec cypress/e2e/pgats-trabalho-conclusao-aut-web.cy.js
      # Passo 3: Salva a pasta do Mochawesome para voce poder baixar depois
      - name: Salvar Relatorio Mochawesome
        if: always() # Garante que o relatorio sera salvo mesmo se o teste falhar
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mochawesome
          path: cypress/reports # Se você usa o mochawesome padrão, mude para mochawesome-report
          retention-days: 7    
